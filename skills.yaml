# yaml-language-server: $schema=./skills.schema.json
skills:
  - name: stop-slop
    steps:
      - type: git-export
        url: https://github.com/hardikpandya/stop-slop

  - group: caveman
    skills:
      - name: caveman
        steps:
          - type: git-export
            repo: JuliusBrussee/caveman
            path: skills/caveman

      - name: caveman-commit
        steps:
          - type: git-export
            repo: JuliusBrussee/caveman
            path: skills/caveman-commit

      - name: caveman-review
        steps:
          - type: git-export
            repo: JuliusBrussee/caveman
            path: skills/caveman-review

      - name: caveman-help
        steps:
          - type: git-export
            repo: JuliusBrussee/caveman
            path: skills/caveman-help

      - name: caveman-stats
        steps:
          - type: git-export
            repo: JuliusBrussee/caveman
            path: skills/caveman-stats

      - name: caveman-compress
        steps:
          - type: git-export
            repo: JuliusBrussee/caveman
            path: skills/caveman-compress

      - name: cavecrew
        steps:
          - type: git-export
            repo: JuliusBrussee/caveman
            path: skills/cavecrew

  - group: moli
    skills:
      - name: moli-webfetch
        steps:
          - type: git-export
            repo: lexmount/moli
            path: skills/moli-webfetch

      - name: moli-websearch
        steps:
          - type: git-export
            repo: lexmount/moli
            path: skills/moli-websearch
    agents_md: |
      ## moli

      `moli` is preinstalled on PATH (`moli --version`). Invoke it directly as `moli ...`.
      If unavailable, stop and report it as blocked. Do not reinstall, upgrade, or fetch an
      installer without explicit user approval.

      For live websites or web research, use the installed moli skills: `moli-webfetch`
      for fetching/capturing JS-rendered pages, `moli-websearch` for keyword/image search.
      Use built-in websearch only if user asks or moli unavailable.
      Use the following search engines: DuckDuckGo HTML, Brave Search.

      Always Prefer `moli fetch` over raw curl for JS-rendered content.

  - name: convert-documents-to-markdown
    steps:
      - type: git-export
        repo: firecrawl/anydoc
        path: skills/convert-documents-to-markdown
      - type: replace
        file: SKILL.md
        from: 'npx -y @firecrawl/anydoc'
        to: 'anydoc'
      - type: replace
        file: SKILL.md
        from: 'It needs Node 20+ and no install:'
        to: 'It is preinstalled on PATH; invoke it directly, never via npx/bunx:'
      - type: assert-absent
        file: SKILL.md
        pattern: 'npx[^\r\n]*@firecrawl/anydoc'
    agents_md: |
      ## anydoc

      `anydoc` is preinstalled on PATH (`anydoc --help`). Invoke it directly as `anydoc ...`.
      Do not use `npx`/`bunx`, reinstall, or upgrade without explicit user approval.

      For office documents, spreadsheets, presentations, ebooks, or PDFs you cannot read directly,
      use the installed `convert-documents-to-markdown` skill and the `anydoc` CLI to convert to Markdown.
      For large documents write to a file with `-o` and read the parts you need.

  - name: graphify
    steps:
      - type: shell
        commands: |
          # Install graphify for opencode into a temp project dir — uses install.py's
          # own _copy_skill_file + _install_opencode_plugin logic so the SKILL.md,
          # references/ sidecar, .graphify_version stamp, and graphify.js plugin are
          # all laid down correctly by graphify itself, not reconstructed here.
          TMP_GRAPHIFY=/tmp/graphify-install
          mkdir -p "$TMP_GRAPHIFY"
          ( cd "$TMP_GRAPHIFY" && graphify install --project --platform opencode ) || exit 1

          # Move installed artifacts to system opencode dir
          cp -r "$TMP_GRAPHIFY/.opencode/skills/graphify" "${OPENCODE_CONFIG_DIR}/skills/graphify"
          cp "$TMP_GRAPHIFY/.opencode/plugins/graphify.js" "${OPENCODE_CONFIG_DIR}/plugins/graphify.js"

          rm -rf "$TMP_GRAPHIFY"
    # agents_md: |
    #   ## graphify

    #   This project has a knowledge graph at graphify-out/ with god nodes, community structure, and cross-file relationships.

    #   When the user types `/graphify`, use the installed graphify skill or instructions before doing anything else.

    #   Rules:
    #   - When graphify-out/graph.json exists, run `graphify query "<question>"` before your first grep, search or source-file read for a codebase question, and put this rule in every subagent prompt that explores code. Read raw files only for lines the graph or an earlier read already located. Use `graphify path "<A>" "<B>"` for relationships and `graphify explain "<concept>"` for focused concepts. When the answer is under a Markdown heading, `graphify section "<heading>"` prints that section's text, so the .md need not be opened. These return a scoped subgraph, usually much smaller than GRAPH_REPORT.md or raw grep output.
    #   - Dirty graphify-out/ files are expected after hooks or incremental updates; dirty graph files are not a reason to skip graphify. Only skip graphify if the task is about stale or incorrect graph output, or the user explicitly says not to use it.
    #   - If graphify-out/wiki/index.md exists, use it for broad navigation instead of raw source browsing.
    #   - Read graphify-out/GRAPH_REPORT.md only for broad architecture review or when query/path/explain do not surface enough context.
    #   - After modifying code, run `graphify update .` to keep the graph current (AST-only, no API cost).
    #   - A committed graphify-out/graph.json is rewritten whole on every build, so a large diff to it in a pull request is expected. Do not flag it as churn or suggest skipping the graph rebuild or its hooks.
