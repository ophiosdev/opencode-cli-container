name: Build and Deploy to GitHub Registry

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ophiosdev/opencode-cli

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        id: checkout
        uses: actions/checkout@v7

      - name: Determine if this tag is the newest in the repo
        id: newest_tag
        run: |
          git fetch --tags --quiet
          if [ "$(git tag -l 'v*' --sort=-version:refname | head -n1)" = "${GITHUB_REF}" ]; then
            echo "IS_NEWEST=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get the version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Validate Semver
        id: semver
        uses: matt-usurp/validate-semver@v3.0.0
        with:
          version: ${{ steps.get_version.outputs.VERSION }}

      - name: Log in to the Container registry
        id: login_registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable=${{ steps.newest_tag.outputs.IS_NEWEST == 'true' }}
          labels: |
            org.opencontainers.image.maintainer=Ophios GmbH
      - name: Build and push Docker image
        id: build_and_push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPENCODE_VERSION=${{ steps.get_version.outputs.VERSION }}
