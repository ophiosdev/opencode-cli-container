[package]
name = "llm-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
bytes = "1"
# `rustls-no-provider` avoids pulling aws-lc-rs (which enables X25519MLKEM768).
# The process-default provider is installed explicitly in main.rs (ring only).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "http2", "charset", "system-proxy", "socks"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-rustls = "0.26"
webpki-roots = "0.26"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
time = "0.3"
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "io-util", "time"] }
syslog = "7"
tokio-stream = "0.1"

# Size-first release profile: the proxy is a loopback shim (latency is
# dominated by LLM inference), so byte-per-size tradeoffs favor shrinking.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
